# ---------------------------------
# 팀원(배소영) 작성 파트 복구: 차량 제어 파라미터
# ---------------------------------
vehicle:
  target_speed: 20.0
  max_steer: 30.0
  lookahead: 5.0

# ---------------------------------
# 이건 작성 파트: FSM 판단 파라미터
# ---------------------------------
mission:
  thresholds:
    stop_distance: 1.0
    approach_distance: 5.0
  
  speeds:
    lane_following: 20.0
    approaching_stop: 10.0
    lane_returning: 15.0
    obstacle_avoiding: 10.0
    stopped: 0.0

# ---------------------------------
# 이건 작성 파트: 인지 파라미터
# ---------------------------------
perception:
  hsv:
    yellow_lower: [20, 100, 100]
    yellow_upper: [40, 255, 255]
    white_lower: [0, 0, 200]
    white_upper: [180, 50, 255]